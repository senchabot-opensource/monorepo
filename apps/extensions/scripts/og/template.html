<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Senchabot Extensions OG template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #09090b;
        overflow: hidden;
      }
      body {
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        color: #fafafa;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 1200px;
        height: 630px;
        padding: 50px 56px 56px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr);
        column-gap: 56px;
        row-gap: 34px;
        background:
          radial-gradient(720px 480px at 0% 0%, rgba(34, 197, 94, 0.12), transparent 70%),
          #09090b;
      }
      .top {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand img {
        height: 36px;
      }
      .platforms {
        display: flex;
        gap: 22px;
        font-size: 19px;
        font-weight: 500;
        color: #d4d4d8;
      }
      .platforms span {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .copy {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding-top: 6px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #4ade80;
      }
      .eyebrow svg {
        width: 24px;
        height: 24px;
      }
      h1 {
        font-size: var(--title-size, 78px);
        line-height: 1.02;
        font-weight: 750;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      .sub {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.38;
        color: #a1a1aa;
        text-wrap: pretty;
      }
      .chips {
        margin-top: auto;
        list-style: none;
        display: flex;
        gap: 10px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 17px 9px 13px;
        border: 1px solid #27272a;
        border-radius: 999px;
        background: #18181b;
        font-size: 18px;
        font-weight: 500;
        color: #e4e4e7;
      }
      .chip svg {
        width: 19px;
        height: 19px;
        color: #22c55e;
      }

      .frame {
        align-self: end;
        padding: 7px;
        border: 1px solid #27272a;
        border-radius: 22px;
        background: #18181b;
        box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.7);
      }
      .stage {
        position: relative;
        overflow: hidden;
        border-radius: 15px;
        /* Same "stream" surface as STAGE_STYLE in src/components/landing/stream-scene.tsx. */
        background-color: #09090b;
        background-image:
          radial-gradient(110% 80% at 0% 0%, rgba(34, 197, 94, 0.16), transparent 60%),
          linear-gradient(160deg, #27272a 0%, #111113 55%, #09090b 100%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 36px 36px;
        mask-image: linear-gradient(to bottom, black, transparent 80%);
      }
      .hills {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 42%;
      }
      .layer {
        position: absolute;
        max-width: none;
      }
      .live {
        position: absolute;
        top: 14px;
        left: 14px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 4px 10px;
        border-radius: 7px;
        background: #dc2626;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #fff;
        text-transform: uppercase;
      }
      .live::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #fff;
      }
      .stage > svg.art {
        position: absolute;
        inset: 0;
        font-family: inherit;
      }

      .guides {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 12px;
        padding: 16px;
        border-radius: 15px;
        background: #09090b;
      }
      .guide {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 16px;
        border: 1px solid #27272a;
        border-radius: 12px;
        background: #18181b;
      }
      .guide-icons {
        display: flex;
        gap: 6px;
      }
      .guide-icons span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border: 1px solid #3f3f46;
        border-radius: 8px;
        background: #27272a;
        color: #4ade80;
      }
      .guide-icons svg {
        width: 17px;
        height: 17px;
      }
      .guide h2 {
        margin-top: 12px;
        font-size: 18px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-wrap: pretty;
      }
      .guide p {
        margin-top: auto;
        font-size: 15px;
        font-weight: 600;
        color: #4ade80;
      }

      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script>
      // Stroke icons from src/components/icons.tsx (24x24, 1.8 stroke).
      const ICON_PATHS = {
        'chat-box':
          '<path d="M5 4.5h14A1.5 1.5 0 0 1 20.5 6v9.5A1.5 1.5 0 0 1 19 17h-9l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5V6A1.5 1.5 0 0 1 5 4.5Z"/><path d="M7.5 9h9M7.5 12.5h5.5"/>',
        'emote-wall':
          '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 0 0 7 0"/><path d="M9 9.75h.01M15 9.75h.01" stroke-width="2.6"/>',
        'sub-sprout':
          '<path d="M12 20.5V11"/><path d="M12 12c0-4 2.8-6.5 7-6.5 0 4.2-2.8 6.5-7 6.5Z"/><path d="M12 14.5c0-3.2-2.3-5.5-6-5.5 0 3.3 2.3 5.5 6 5.5Z"/><path d="M8 20.5h8"/>',
        raffle:
          '<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5.5 12v7.5a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V12M12 8v12.5"/><path d="M12 8C10.5 5 7 4.5 7 6.5 7 8 10 8 12 8Zm0 0c1.5-3 5-3.5 5-1.5C17 8 14 8 12 8Z"/>',
        'obs-bridge':
          '<path d="M9 3.5v4M15 3.5v4"/><path d="M6.5 7.5h11v3.5a5.5 5.5 0 0 1-11 0V7.5Z"/><path d="M12 16.5v4"/>',
        guides:
          '<path d="M12 6.5c-1.8-1.3-4.3-2-7.5-2v13c3.2 0 5.7.7 7.5 2 1.8-1.3 4.3-2 7.5-2v-13c-3.2 0-5.7.7-7.5 2Z"/><path d="M12 6.5v13"/>',
        check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
      };

      const icon = (name) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;

      const esc = (text) =>
        String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      // SceneBackdrop from stream-scene.tsx: faint grid and two hills.
      const BACKDROP = `<div class="grid"></div>
        <svg class="hills" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 58C50 34 96 50 150 40s98-26 152-6 70 14 98 8v58H0Z" fill="#3f3f46" fill-opacity="0.35"/>
          <path d="M0 78c64-18 124-4 196-14s136-16 204 4v32H0Z" fill="#18181b" fill-opacity="0.9"/>
        </svg>`;

      function stage(card) {
        const { visual, shots } = card;
        const layers = (visual.layers ?? [])
          .map(
            (l) =>
              `<img class="layer" src="${shots[l.capture]}" style="left:${l.x}px;top:${l.y}px;width:${l.width}px;height:${l.height}px" alt="">`,
          )
          .join('');
        return `${BACKDROP}${layers}${visual.live ? '<span class="live">Live</span>' : ''}`;
      }

      // A mod's !scene command in chat and OBS switching to that scene, after ObsBridgeVisual
      // in src/components/landing/tool-visuals.tsx, laid out for the larger stage.
      function obsBridge(card) {
        const scenes = ['Just Chatting', 'Gaming', 'BRB'];
        const rows = scenes
          .map((scene, i) => {
            const y = 164 + i * 50;
            const active = scene === 'Gaming';
            return `${
              active
                ? `<rect x="356" y="${y}" width="152" height="40" rx="9" fill="#22c55e" fill-opacity="0.14"/>
                   <rect x="356" y="${y + 9}" width="4" height="22" rx="2" fill="#22c55e"/>
                   <circle cx="492" cy="${y + 20}" r="5" fill="#4ade80"/>`
                : ''
            }<text x="372" y="${y + 26}" font-size="18" font-weight="${active ? 600 : 400}" fill="${active ? '#fff' : '#a1a1aa'}">${scene}</text>`;
          })
          .join('');
        return `<svg class="art" viewBox="0 0 538 432" width="538" height="432" aria-hidden="true">
          <g font-size="18">
            <text x="42" y="132" fill="#a1a1aa" opacity="0.4"><tspan fill="#facc15" font-weight="600">pixelfox</tspan><tspan dx="8">PogChamp</tspan></text>
            <text x="42" y="166" fill="#a1a1aa" opacity="0.55"><tspan fill="#f472b6" font-weight="600">sunny</tspan><tspan dx="8">gg</tspan></text>
            <text x="42" y="200" fill="#a1a1aa" opacity="0.75"><tspan fill="#60a5fa" font-weight="600">moonlit</tspan><tspan dx="8">LUL</tspan></text>
            <rect x="26" y="218" width="286" height="48" rx="12" fill="#fff" fill-opacity="0.08"/>
            <rect x="42" y="234" width="16" height="16" rx="3" fill="#22c55e"/>
            <text x="68" y="248.5"><tspan fill="#4ade80" font-weight="600">mod_jay</tspan><tspan dx="8" fill="#fafafa" font-weight="600">!scene Gaming</tspan></text>
          </g>
          <path d="M318 242h20m-7-7 7 7-7 7" fill="none" stroke="#71717a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="346" y="94" width="172" height="244" rx="16" fill="#18181b" stroke="#fff" stroke-opacity="0.1"/>
          <text x="364" y="128" font-size="15" font-weight="600" fill="#a1a1aa">${esc(card.visual.scenesLabel)}</text>
          <line x1="346" x2="518" y1="146" y2="146" stroke="#fff" stroke-opacity="0.08"/>
          ${rows}
          <text x="432" y="370" text-anchor="middle" font-size="14" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ws://localhost:4455</text>
        </svg>`;
      }

      function guides(card) {
        return card.visual.guides
          .map(
            (g) => `<article class="guide">
              <div class="guide-icons">${g.icons.map((name) => `<span>${icon(name)}</span>`).join('')}</div>
              <h2>${esc(g.title)}</h2>
              <p>${esc(card.visual.readLabel)} →</p>
            </article>`,
          )
          .join('');
      }

      async function settle() {
        const faces = await document.fonts.load('750 78px Geist');
        if (faces.length === 0) throw new Error('Geist did not load from Google Fonts');
        await document.fonts.ready;
        await Promise.all([...document.images].map((img) => img.decode()));
      }

      window.renderCard = async (card) => {
        const { width, height } = card.stage;
        const visual =
          card.visual.kind === 'guides'
            ? `<div class="guides" style="width:${width}px;height:${height}px">${guides(card)}</div>`
            : `<div class="stage" style="width:${width}px;height:${height}px">${
                card.visual.kind === 'obs-bridge' ? BACKDROP + obsBridge(card) : stage(card)
              }</div>`;
        document.getElementById('root').innerHTML = `
          <div class="card" style="${card.titleSize ? `--title-size:${card.titleSize}px` : ''}">
            <header class="top">
              <div class="brand"><img src="${card.logo}" alt="">Senchabot Extensions</div>
              <div class="platforms">
                <span><i class="dot" style="background:#9146FF"></i>Twitch</span>
                <span><i class="dot" style="background:#53FC18"></i>Kick</span>
              </div>
            </header>
            <section class="copy">
              ${card.eyebrow ? `<p class="eyebrow">${icon(card.eyebrow.icon)}${esc(card.eyebrow.label)}</p>` : ''}
              <h1>${esc(card.title)}</h1>
              <p class="sub">${esc(card.subtitle)}</p>
              <ul class="chips">${card.trust.map((t) => `<li class="chip">${icon('check')}${esc(t)}</li>`).join('')}</ul>
            </section>
            <figure class="frame">${visual}</figure>
          </div>`;
        await settle();
      };

      window.renderIcon = async ({ size, logo }) => {
        // 60% height keeps the whole logo inside the maskable safe zone (a circle of 80%).
        document.getElementById('root').innerHTML = `<div class="icon" style="width:${size}px;height:${size}px">
          <img src="${logo}" alt="" style="height:${Math.round(size * 0.6)}px">
        </div>`;
        await Promise.all([...document.images].map((img) => img.decode()));
      };
    </script>
  </body>
</html>
